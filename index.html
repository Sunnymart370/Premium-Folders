<style>
/* Base */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;padding:32px 20px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;text-align:center;overflow-x:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#2a0a5e linear-gradient(160deg,#1a0540 0%,#4c1d95 50%,#7e22ce 100%) fixed;
}
body::before,body::after{
  content:"";position:fixed;z-index:0;border-radius:50%;
  filter:blur(70px);pointer-events:none
}
body::before{width:320px;height:320px;top:-90px;right:-90px;background:#a855f7;opacity:.45}
body::after{width:280px;height:280px;bottom:-90px;left:-90px;background:#d946ef;opacity:.3}

/* Conteúdo */
main{position:relative;z-index:1;width:100%;max-width:420px}
h1{margin:0 0 8px;font-size:1.6rem;line-height:1.2}
p{margin:0 0 32px;color:#e4d4ff;line-height:1.5}

.avatar{
  width:104px;height:104px;margin:0 auto 20px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:3px solid rgba(255,255,255,.35);
  background:linear-gradient(135deg,#a855f7,#d946ef);
  box-shadow:0 12px 36px -10px rgba(217,70,239,.8);
  font-size:2.2rem;font-weight:700
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* Botão */
.btn{
  position:relative;overflow:hidden;display:block;
  padding:18px 20px;border-radius:18px;
  color:#fff;text-decoration:none;font-size:1.1rem;font-weight:700;
  background:linear-gradient(110deg,#8b5cf6,#d946ef,#8b5cf6) 0 0/200% 100%;
  box-shadow:0 14px 34px -10px rgba(217,70,239,.85);
  animation:flow 4s linear infinite,pulse 2.6s ease-in-out infinite;
  transition:transform .15s
}
.btn::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite
}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}

@keyframes flow{to{background-position:-200% 0}}
@keyframes pulse{50%{box-shadow:0 18px 44px -8px #d946ef}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){.btn,.btn::after{animation:none}}
</style>
</head>
<body>
<main>

  <!-- EDITE (2/3): foto, nome e frase
       Foto: salve como foto.jpg ao lado deste arquivo, ou troque foto.jpg por um link.
       Se a foto não carregar, aparecem as letras SN (troque pelas suas iniciais). -->
  <div class="avatar"><img src="https://files.catbox.moe/x1ppar.jpg" alt="Seu Nome" onerror="this.replaceWith('SN')"></div>
  <h1>🏆Premium Folders🏆</h1>
  <p>Tap the button to access previews and buy at the best price.</p>

  <!-- EDITE (3/3): texto do botão. O link já leva ao seu Telegram com a mensagem pronta. -->
  <a class="btn" href="https://t.me/Premium_Folders7?text=I%20ask%20for%20the%20menu" target="_blank" rel="noopener">See Menu here</a>

</main>
</body>
